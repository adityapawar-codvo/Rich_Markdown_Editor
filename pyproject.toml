[project]
name = "context-editor"
version = "0.1.0"
description = "Project Context Editor: a TipTap-based rich document editor for NiceGUI with versions, publishing, comments, an AI editing agent and Word/PDF export"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    "lxml>=5.3.0",
    "mammoth>=1.13.0",
    "markdown-it-py>=4.2.0",
    "nh3>=0.2.20",
    "nicegui>=3.18.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "playwright>=1.49.0",
    "pygments>=2.18.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
]

[project.scripts]
context-editor = "ctxeditor.__main__:run"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ctxeditor"
wheel-exclude = ["**/node_modules/**", "**/*.test.mjs"]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "pypdf>=5.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
main_file = ""
addopts = "-p nicegui.testing.user_plugin"
markers = ["browser: needs headless Chromium (playwright install chromium)"]
